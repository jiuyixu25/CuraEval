[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "curaeval"
version = "1.0.0"
description = "Evaluating demonstration curation on mixed-skill robot data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "h5py>=3.8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["curaeval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
